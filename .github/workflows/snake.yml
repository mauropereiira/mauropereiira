name: snake

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mauropereiira
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#c9a227&color_dots=#ebf3ea,#b9d1ad,#77a879,#4e7d5c,#28563c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f2d86f&color_dots=#0d1a12,#1c3d2c,#2c5a40,#65986a,#9dc183

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
