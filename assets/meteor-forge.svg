<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Mauro Pereira - local-first product builder</title>
  <desc id="desc">An animated meteor crosses a mineral-green sky beside Mauro Pereira's name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130f"/>
      <stop offset="0.52" stop-color="#10251b"/>
      <stop offset="1" stop-color="#193d2b"/>
    </linearGradient>
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e7d77c" stop-opacity="0.75"/>
      <stop offset="0.28" stop-color="#9dc183" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9dc183" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9dc183" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#d4e8c8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f2d86f"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .eyebrow { fill: #9dc183; font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px; }
    .name { fill: #f4f7f2; font: 700 54px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1.5px; }
    .tagline { fill: #c8d4ca; font: 400 20px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .chip { fill: #e6eee5; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.5px; }
    .orbit { animation: orbit 8s linear infinite; }
    .star-a { animation: twinkle 2.8s ease-in-out infinite; }
    .star-b { animation: twinkle 3.7s ease-in-out 1.1s infinite; }
    .star-c { animation: twinkle 4.4s ease-in-out 0.4s infinite; }
    @keyframes orbit { to { stroke-dashoffset: -120; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.95; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .star-a, .star-b, .star-c { animation: none; }
    }
  </style>

  <rect width="1000" height="300" rx="22" fill="url(#background)"/>
  <path d="M0 246 C190 210 352 286 526 252 C706 217 846 236 1000 188 V300 H0Z" fill="#091b13" opacity="0.8"/>
  <path d="M0 266 C184 230 350 302 542 270 C735 237 850 264 1000 216" fill="none" stroke="#2c5a40" stroke-width="1" opacity="0.55"/>

  <g fill="#dcebd8">
    <circle class="star-a" cx="596" cy="48" r="1.8"/>
    <circle class="star-b" cx="684" cy="78" r="1.3"/>
    <circle class="star-c" cx="938" cy="48" r="1.6"/>
    <circle class="star-a" cx="882" cy="92" r="1.1"/>
    <circle class="star-b" cx="760" cy="35" r="1.4"/>
    <circle class="star-c" cx="650" cy="188" r="1.2"/>
    <circle class="star-a" cx="960" cy="176" r="1.5"/>
  </g>

  <circle cx="820" cy="147" r="116" fill="url(#impact)"/>
  <circle cx="820" cy="147" r="72" fill="none" stroke="#75a57a" stroke-width="1" opacity="0.22"/>
  <circle cx="820" cy="147" r="98" fill="none" stroke="#9dc183" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.42" class="orbit"/>
  <circle cx="820" cy="147" r="42" fill="#122e20" stroke="#8ab389" stroke-width="2"/>
  <path d="M794 157 L808 125 L840 116 L852 145 L832 174 L803 177Z" fill="#77a879" opacity="0.92"/>
  <path d="M808 125 L823 144 L840 116 M823 144 L852 145 M823 144 L832 174 M823 144 L803 177" fill="none" stroke="#b9d1ad" stroke-width="1.4" opacity="0.75"/>

  <g filter="url(#glow)">
    <path d="M520 52 L706 118" stroke="url(#meteor)" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
    <circle cx="708" cy="119" r="6" fill="#f2d86f"/>
    <animateTransform attributeName="transform" type="translate" values="-170 -60; 250 115; 250 115" keyTimes="0;0.58;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <text x="58" y="63" class="eyebrow">HELLO FROM PORTUGAL / EARTH</text>
  <text x="58" y="132" class="name">Mauro Pereira</text>
  <text x="58" y="176" class="tagline">Local-first tools for humans</text>
  <text x="58" y="207" class="tagline">and the agents they choose to trust.</text>

  <g transform="translate(58 236)">
    <rect width="142" height="30" rx="15" fill="#28563c"/>
    <text x="71" y="20" text-anchor="middle" class="chip">MOLDAVITE</text>
    <rect x="153" width="154" height="30" rx="15" fill="#1c3d2c" stroke="#4e7d5c"/>
    <text x="230" y="20" text-anchor="middle" class="chip">WORDPRESS.COM</text>
    <rect x="318" width="126" height="30" rx="15" fill="#2c2a19" stroke="#756c31"/>
    <text x="381" y="20" text-anchor="middle" class="chip">OPEN SOURCE</text>
  </g>
</svg>
